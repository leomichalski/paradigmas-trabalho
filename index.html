<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elm + Mermaid</title>
  <link rel="stylesheet" href="style.css">

  <script>
    try {
      if (localStorage.getItem('theme') === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    } catch (e) {}
  </script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button"></button>

  <div id="app"></div>

  <script>
    (function () {
      var root = document.documentElement;
      var btn = document.getElementById('theme-toggle');

      function refreshLabel() {
        btn.textContent = root.getAttribute('data-theme') === 'dark' ? 'Modo claro' : 'Modo escuro';
      }

      btn.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        refreshLabel();
      });

      refreshLabel();
    })();
  </script>

  <!-- 1. Load your compiled Elm code -->
  <script src="elm.js"></script>

  <!-- 2. Load Mermaid and define the custom element -->
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';
    
    mermaid.initialize({ startOnLoad: false });

    class MermaidElement extends HTMLElement {
      constructor() {
        super();
        // Use Shadow DOM so Mermaid's SVG doesn't overwrite Elm's Virtual DOM
        this.attachShadow({ mode: 'open' });
      }

      connectedCallback() {
        this.renderDiagram();
        // Watch for Elm updating the text, and re-render when it does!
        this.observer = new MutationObserver(() => this.renderDiagram());
        this.observer.observe(this, { characterData: true, childList: true, subtree: true });
      }

      disconnectedCallback() {
        if (this.observer) this.observer.disconnect();
      }

      async renderDiagram() {
        const text = this.textContent.trim();
        if (!text) return;

        try {
          // Generate a unique ID for the diagram
          const id = 'mermaid-' + Math.random().toString(36).substring(2, 9);
          const { svg } = await mermaid.render(id, text);
          
          // Put the SVG inside the Shadow Root
          this.shadowRoot.innerHTML = svg;
          this.dispatchEvent(new CustomEvent('render'));
        } catch (err) {
          // Send the error back to Elm
          this.dispatchEvent(new CustomEvent('error', { detail: { error: err } }));
        }
      }
    }

    customElements.define('mermaid-element', MermaidElement);

    // 3. Start Elm
    Elm.Main.init({
      node: document.getElementById('app')
    });
  </script>
</body>
</html>
